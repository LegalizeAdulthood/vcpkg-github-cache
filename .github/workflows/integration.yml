name: Integration

on:
  push:
    branches:
      - develop
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:
    inputs:
      matrix-mode:
        description: Integration matrix shape.
        required: false
        default: selected
        type: choice
        options:
          - selected
          - full-release
      explicit-refs:
        description: Comma-separated vcpkg refs.
        required: false
        default: ""
        type: string
      latest-tags:
        description: Number of latest release tags in selected mode.
        required: false
        default: "1"
        type: string
      platforms:
        description: Comma-separated platforms to test.
        required: false
        default: ubuntu
        type: string
      cache-mode:
        description: Cache scenario to run.
        required: false
        default: readwrite
        type: choice
        options:
          - readwrite
          - readonly
          - disabled
      artifact-retention-days:
        description: Retention days for integration logs and artifacts.
        required: false
        default: "7"
        type: string
      missing-dependency-probe:
        description: Optional missing system dependency probe.
        required: false
        default: none
        type: choice
        options:
          - none
          - bison

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: Plan integration matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.refs.outputs.matrix }}
      refs: ${{ steps.refs.outputs.refs }}
      platforms: ${{ steps.inputs.outputs.platforms }}
      cache_mode: ${{ steps.inputs.outputs.cache_mode }}
      cache_access: ${{ steps.inputs.outputs.cache_access }}
      freebsd: ${{ steps.inputs.outputs.freebsd }}
      install_nuget: ${{ steps.inputs.outputs.install_nuget }}
      matrix_mode: ${{ steps.inputs.outputs.matrix_mode }}
      missing_dependency_probe: >-
        ${{ steps.inputs.outputs.missing_dependency_probe }}
      netbsd: ${{ steps.inputs.outputs.netbsd }}
      openbsd: ${{ steps.inputs.outputs.openbsd }}
      retention: ${{ steps.inputs.outputs.retention }}
      ubuntu: ${{ steps.inputs.outputs.ubuntu }}
      windows: ${{ steps.inputs.outputs.windows }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Record integration inputs
        id: inputs
        env:
          ARTIFACT_RETENTION_DAYS: >-
            ${{ inputs['artifact-retention-days'] || '7' }}
          CACHE_MODE: ${{ inputs['cache-mode'] || 'readwrite' }}
          EVENT_NAME: ${{ github.event_name }}
          MATRIX_MODE: >-
            ${{ github.event_name == 'schedule' && 'scheduled' ||
                inputs['matrix-mode'] || 'selected' }}
          MISSING_DEPENDENCY_PROBE: >-
            ${{ inputs['missing-dependency-probe'] || 'none' }}
          RAW_PLATFORMS: ${{ inputs.platforms || '' }}
        shell: bash
        run: |
          freebsd=false
          matrix_mode=$(printf '%s' "$MATRIX_MODE" |
            tr '[:upper:]' '[:lower:]' |
            tr -d '[:space:]')
          netbsd=false
          openbsd=false
          ubuntu=false
          windows=false
          platforms=""

          case "$matrix_mode" in
            selected|full-release|scheduled)
              ;;
            *)
              echo "Unsupported matrix mode: ${matrix_mode}" >&2
              exit 1
              ;;
          esac

          if [ "$EVENT_NAME" = "push" ]; then
            selected_platforms_value=ubuntu,windows,freebsd,openbsd,netbsd
          elif [ "$matrix_mode" = full-release ] ||
              [ "$matrix_mode" = scheduled ]; then
            selected_platforms_value=all
          else
            selected_platforms_value=${RAW_PLATFORMS:-ubuntu}
          fi

          IFS=',' read -ra selected_platforms <<< "$selected_platforms_value"
          for platform in "${selected_platforms[@]}"; do
            platform=$(printf '%s' "$platform" |
              tr '[:upper:]' '[:lower:]' |
              tr -d '[:space:]')

            if [ -z "$platform" ]; then
              continue
            fi

            if [ -n "$platforms" ]; then
              platforms="${platforms},${platform}"
            else
              platforms="$platform"
            fi

            case "$platform" in
              all)
                freebsd=true
                netbsd=true
                openbsd=true
                ubuntu=true
                windows=true
                ;;
              freebsd|freebsd-vm)
                freebsd=true
                ;;
              netbsd|netbsd-vm)
                netbsd=true
                ;;
              openbsd|openbsd-vm)
                openbsd=true
                ;;
              linux|ubuntu|ubuntu-latest)
                ubuntu=true
                ;;
              win32|windows|windows-2022|windows-latest)
                windows=true
                ;;
            esac
          done

          if [ -z "$platforms" ]; then
            platforms=ubuntu
            ubuntu=true
          fi

          cache_access=readwrite
          install_nuget=true
          missing_dependency_probe=$(printf '%s' "$MISSING_DEPENDENCY_PROBE" |
            tr '[:upper:]' '[:lower:]' |
            tr -d '[:space:]')
          case "$CACHE_MODE" in
            readonly)
              cache_access=readonly
              ;;
            disabled)
              install_nuget=false
              ;;
          esac

          case "$missing_dependency_probe" in
            none|bison)
              ;;
            *)
              echo "Unsupported missing dependency probe: ${missing_dependency_probe}" >&2
              exit 1
              ;;
          esac

          {
            echo "platforms=${platforms}"
            echo "cache_mode=${CACHE_MODE}"
            echo "cache_access=${cache_access}"
            echo "freebsd=${freebsd}"
            echo "install_nuget=${install_nuget}"
            echo "matrix_mode=${matrix_mode}"
            echo "missing_dependency_probe=${missing_dependency_probe}"
            echo "netbsd=${netbsd}"
            echo "openbsd=${openbsd}"
            echo "retention=${ARTIFACT_RETENTION_DAYS}"
            echo "ubuntu=${ubuntu}"
            echo "windows=${windows}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve vcpkg refs
        id: refs
        env:
          EXPLICIT_REFS: ${{ inputs['explicit-refs'] || '' }}
          EVENT_NAME: ${{ github.event_name }}
          LATEST_TAGS: >-
            ${{ inputs['latest-tags'] || '1' }}
          MATRIX_MODE: ${{ steps.inputs.outputs.matrix_mode }}
        shell: bash
        run: |
          args=(--github-output "$GITHUB_OUTPUT")

          if [ "$EVENT_NAME" = "push" ]; then
            args+=(--latest 2)
          elif [ "$MATRIX_MODE" = full-release ]; then
            args+=(--latest 12)
            if [ -n "$EXPLICIT_REFS" ]; then
              args+=(--extra-refs "$EXPLICIT_REFS")
            fi
          elif [ "$MATRIX_MODE" = scheduled ]; then
            args+=(--latest 12 --rotate-older 1)
          elif [ -n "$EXPLICIT_REFS" ]; then
            args+=(--refs "$EXPLICIT_REFS")
          else
            args+=(--latest "$LATEST_TAGS")
          fi

          node scripts/resolve-vcpkg-refs.mjs "${args[@]}"

      - name: Write integration plan summary
        env:
          ARTIFACT_RETENTION_DAYS: ${{ steps.inputs.outputs.retention }}
          CACHE_MODE: ${{ steps.inputs.outputs.cache_mode }}
          MATRIX_MODE: ${{ steps.inputs.outputs.matrix_mode }}
          MATRIX: ${{ steps.refs.outputs.matrix }}
          MISSING_DEPENDENCY_PROBE: >-
            ${{ steps.inputs.outputs.missing_dependency_probe }}
          PLATFORMS: ${{ steps.inputs.outputs.platforms }}
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          {
            echo "## Integration plan"
            echo
            echo "- Matrix mode: \`${MATRIX_MODE}\`"
            echo "- Platforms: \`${PLATFORMS}\`"
            echo "- Cache mode: \`${CACHE_MODE}\`"
            echo "- Missing dependency probe: \`${MISSING_DEPENDENCY_PROBE}\`"
            echo "- Artifact retention: \`${ARTIFACT_RETENTION_DAYS}\` days"
            echo "- vcpkg refs: \`${REFS}\`"
            echo
            echo '```json'
            echo "$MATRIX"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ubuntu:
    name: Ubuntu fixture (${{ matrix.vcpkg_ref }})
    needs: plan
    if: ${{ needs.plan.outputs.ubuntu == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout action
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ matrix.vcpkg_ref }}
          path: vcpkg
          persist-credentials: false

      - name: Setup vcpkg cache
        uses: ./
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          access: ${{ needs.plan.outputs.cache_access }}
          install-nuget: ${{ needs.plan.outputs.install_nuget }}

      - name: Build fixture
        env:
          BUILD_DIR: ${{ runner.temp }}/vcpkg-github-cache-fixture
          BUILD_LOG: build.log
          BUILD_STATUS: build.status
          VCPKG_HOST_TRIPLET: x64-linux-vcpkg-github-cache
          VCPKG_OVERLAY_TRIPLETS: >-
            ${{ github.workspace }}/test/fixtures/cmake-vcpkg/triplets
          VCPKG_ROOT: vcpkg
          VCPKG_TARGET_TRIPLET: x64-linux-vcpkg-github-cache
        run: sh test/fixtures/cmake-vcpkg/build-fixture.sh

      - name: Ensure fixture log exists
        if: always()
        run: |
          touch build.log
          if [ ! -f build.status ]; then
            echo 1 > build.status
          fi

      - name: Analyze fixture cache
        id: analyze
        if: always()
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build.log
          fail-on: never

      - name: Assert fixture cache status
        if: always()
        env:
          BUILD_STATUS_FILE: build.status
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          CACHE_STATUS: ${{ steps.analyze.outputs['cache-status'] }}
          DIAGNOSIS: ${{ steps.analyze.outputs.diagnosis }}
          FAILURE_KIND: ${{ steps.analyze.outputs['failure-kind'] }}
        run: node scripts/assert-integration-result.mjs

      - name: Build fixture warm pass
        if: ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' }}
        env:
          BUILD_DIR: ${{ runner.temp }}/vcpkg-github-cache-fixture-warm
          BUILD_LOG: build-warm.log
          BUILD_STATUS: build-warm.status
          VCPKG_HOST_TRIPLET: x64-linux-vcpkg-github-cache
          VCPKG_OVERLAY_TRIPLETS: >-
            ${{ github.workspace }}/test/fixtures/cmake-vcpkg/triplets
          VCPKG_ROOT: vcpkg
          VCPKG_TARGET_TRIPLET: x64-linux-vcpkg-github-cache
        run: sh test/fixtures/cmake-vcpkg/build-fixture.sh

      - name: Analyze warm fixture cache
        id: analyze_warm
        if: ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' }}
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build-warm.log
          fail-on: never

      - name: Assert warm fixture cache status
        if: ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' }}
        env:
          BUILD_STATUS_FILE: build-warm.status
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          CACHE_STATUS: ${{ steps.analyze_warm.outputs['cache-status'] }}
          DIAGNOSIS: ${{ steps.analyze_warm.outputs.diagnosis }}
          EXPECTED_CACHE_STATUS: warm-hit
          EXPECTED_FAILURE_KIND: ""
          FAILURE_KIND: ${{ steps.analyze_warm.outputs['failure-kind'] }}
        run: node scripts/assert-integration-result.mjs

      - name: Upload fixture logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-fixture-${{ matrix.vcpkg_ref_slug }}
          path: |
            build.log
            build.status
            build-warm.log
            build-warm.status
          if-no-files-found: warn
          retention-days: ${{ needs.plan.outputs.retention }}

  windows:
    name: Windows fixture (${{ matrix.vcpkg_ref }})
    needs: plan
    if: ${{ needs.plan.outputs.windows == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout action
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ matrix.vcpkg_ref }}
          path: vcpkg
          persist-credentials: false

      - name: Setup vcpkg cache
        uses: ./
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          access: ${{ needs.plan.outputs.cache_access }}
          install-nuget: ${{ needs.plan.outputs.install_nuget }}

      - name: Build fixture
        shell: cmd
        env:
          BUILD_DIR: ${{ runner.temp }}\vcpkg-github-cache-fixture
          BUILD_LOG: build.log
          BUILD_STATUS: build.status
          VCPKG_HOST_TRIPLET: x64-windows-vcpkg-github-cache
          VCPKG_OVERLAY_TRIPLETS: >-
            ${{ github.workspace }}\test\fixtures\cmake-vcpkg\triplets
          VCPKG_ROOT: vcpkg
          VCPKG_TARGET_TRIPLET: x64-windows-vcpkg-github-cache
        run: call test\fixtures\cmake-vcpkg\build-fixture.bat

      - name: Ensure fixture log exists
        if: always()
        shell: cmd
        run: |
          if not exist build.log type nul > build.log
          if not exist build.status > build.status echo 1

      - name: Analyze fixture cache
        id: analyze
        if: always()
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build.log
          fail-on: never

      - name: Assert fixture cache status
        if: always()
        shell: cmd
        env:
          BUILD_STATUS_FILE: build.status
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          CACHE_STATUS: ${{ steps.analyze.outputs['cache-status'] }}
          DIAGNOSIS: ${{ steps.analyze.outputs.diagnosis }}
          FAILURE_KIND: ${{ steps.analyze.outputs['failure-kind'] }}
        run: node scripts\assert-integration-result.mjs

      - name: Build fixture warm pass
        if: ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' }}
        shell: cmd
        env:
          BUILD_DIR: ${{ runner.temp }}\vcpkg-github-cache-fixture-warm
          BUILD_LOG: build-warm.log
          BUILD_STATUS: build-warm.status
          VCPKG_HOST_TRIPLET: x64-windows-vcpkg-github-cache
          VCPKG_OVERLAY_TRIPLETS: >-
            ${{ github.workspace }}\test\fixtures\cmake-vcpkg\triplets
          VCPKG_ROOT: vcpkg
          VCPKG_TARGET_TRIPLET: x64-windows-vcpkg-github-cache
        run: call test\fixtures\cmake-vcpkg\build-fixture.bat

      - name: Analyze warm fixture cache
        id: analyze_warm
        if: ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' }}
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build-warm.log
          fail-on: never

      - name: Assert warm fixture cache status
        if: ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' }}
        shell: cmd
        env:
          BUILD_STATUS_FILE: build-warm.status
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          CACHE_STATUS: ${{ steps.analyze_warm.outputs['cache-status'] }}
          DIAGNOSIS: ${{ steps.analyze_warm.outputs.diagnosis }}
          EXPECTED_CACHE_STATUS: warm-hit
          EXPECTED_FAILURE_KIND: ""
          FAILURE_KIND: ${{ steps.analyze_warm.outputs['failure-kind'] }}
        run: node scripts\assert-integration-result.mjs

      - name: Upload fixture logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-fixture-${{ matrix.vcpkg_ref_slug }}
          path: |
            build.log
            build.status
            build-warm.log
            build-warm.status
          if-no-files-found: warn
          retention-days: ${{ needs.plan.outputs.retention }}

  freebsd:
    name: FreeBSD fixture (${{ matrix.vcpkg_ref }})
    needs: plan
    if: ${{ needs.plan.outputs.freebsd == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout action
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ matrix.vcpkg_ref }}
          path: vcpkg
          persist-credentials: false

      - name: Generate vcpkg cache setup script
        id: vc
        uses: ./
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          access: ${{ needs.plan.outputs.cache_access }}
          install-nuget: ${{ needs.plan.outputs.install_nuget }}
          execution-mode: emit-script
          target-os: freebsd

      - name: Build fixture on FreeBSD
        uses: vmactions/freebsd-vm@b84ab5559b5a1bb4b8ee2737d2506a16e1737636 # v1
        env:
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          FIXTURE_REQUIRE_BISON: >-
            ${{ needs.plan.outputs.missing_dependency_probe == 'bison' &&
                'true' || '' }}
          VCPKG_GITHUB_CACHE_TOKEN: ${{ github.token }}
          VCPKG_ROOT: vcpkg
        with:
          release: "14.3"
          usesh: true
          sync: rsync
          copyback: true
          envs: >-
            CACHE_MODE FIXTURE_REQUIRE_BISON VCPKG_GITHUB_CACHE_TOKEN
            VCPKG_ROOT
          prepare: |
            pkg update
            missing_dependency_probe=${{ needs.plan.outputs.missing_dependency_probe }}
            packages="cmake ninja git pkgconf patchelf gmake bash"
            if [ "${missing_dependency_probe}" != bison ]; then
              packages="${packages} bison"
            fi
            pkg install -y ${packages}
          run: |
            export BSD_COPYBACK_DIR=.freebsd-copyback
            export BSD_TRIPLET=x64-freebsd-vcpkg-github-cache
            export VCPKG_GITHUB_CACHE_SETUP_ENV="${{ steps.vc.outputs.setup-env }}"
            export VCPKG_GITHUB_CACHE_SETUP_SCRIPT="${{ steps.vc.outputs.setup-script }}"
            sh test/fixtures/cmake-vcpkg/run-bsd-fixture.sh

      - name: Ensure fixture log exists
        if: always()
        run: |
          touch setup.log build.log build-warm.log tool-warm.log
          if [ ! -f build.status ]; then
            echo 1 > build.status
          fi
          if [ ! -f build-warm.status ]; then
            echo 1 > build-warm.status
          fi
          if [ ! -f tool-warm.status ]; then
            echo 1 > tool-warm.status
          fi

      - name: Analyze fixture cache
        id: analyze
        if: always()
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build.log
          fail-on: never

      - name: Assert fixture cache status
        if: always()
        env:
          BUILD_STATUS_FILE: build.status
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          CACHE_STATUS: ${{ steps.analyze.outputs['cache-status'] }}
          DIAGNOSIS: ${{ steps.analyze.outputs.diagnosis }}
          FAILURE_KIND: ${{ steps.analyze.outputs['failure-kind'] }}
        run: node scripts/assert-integration-result.mjs

      - name: Check FreeBSD fixture status
        if: >-
          ${{ always() &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        run: |
          exit "$(cat build.status)"

      - name: Assert FreeBSD missing dependency probe
        if: >-
          ${{ always() &&
              needs.plan.outputs.missing_dependency_probe != 'none' }}
        env:
          BUILD_LOG_FILE: build.log
          BUILD_STATUS_FILE: build.status
          EXPECTED_NEEDED_BY: project configure
          EXPECTED_TOOL: ${{ needs.plan.outputs.missing_dependency_probe }}
        run: node scripts/assert-missing-system-dependency.mjs

      - name: Assert FreeBSD vcpkg tool cache
        if: >-
          ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        env:
          BUILD_STATUS_FILE: build.status
          TARGET_OS: freebsd
          TOOL_LOG_FILE: setup.log
          TOOL_WARM_LOG_FILE: tool-warm.log
          TOOL_WARM_STATUS_FILE: tool-warm.status
        run: node scripts/assert-bsd-tool-cache.mjs

      - name: Analyze warm fixture cache
        id: analyze_warm
        if: >-
          ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build-warm.log
          fail-on: never

      - name: Assert warm fixture cache status
        if: >-
          ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        env:
          BUILD_STATUS_FILE: build-warm.status
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          CACHE_STATUS: ${{ steps.analyze_warm.outputs['cache-status'] }}
          DIAGNOSIS: ${{ steps.analyze_warm.outputs.diagnosis }}
          EXPECTED_CACHE_STATUS: warm-hit
          EXPECTED_FAILURE_KIND: ""
          FAILURE_KIND: ${{ steps.analyze_warm.outputs['failure-kind'] }}
        run: node scripts/assert-integration-result.mjs

      - name: Check FreeBSD warm fixture status
        if: >-
          ${{ always() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        run: |
          exit "$(cat build-warm.status)"

      - name: Upload fixture logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-fixture-${{ matrix.vcpkg_ref_slug }}
          path: |
            setup.log
            build.log
            build.status
            build-warm.log
            build-warm.status
            tool-warm.log
            tool-warm.status
          if-no-files-found: warn
          retention-days: ${{ needs.plan.outputs.retention }}

  openbsd:
    name: OpenBSD fixture (${{ matrix.vcpkg_ref }})
    needs: plan
    if: ${{ needs.plan.outputs.openbsd == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout action
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ matrix.vcpkg_ref }}
          path: vcpkg
          persist-credentials: false

      - name: Generate vcpkg cache setup script
        id: vc
        uses: ./
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          access: ${{ needs.plan.outputs.cache_access }}
          install-nuget: ${{ needs.plan.outputs.install_nuget }}
          execution-mode: emit-script
          target-os: openbsd

      - name: Build fixture on OpenBSD
        uses: vmactions/openbsd-vm@18edb32f4e48dae5865d7b8b3a9587bc01218a20 # v1
        env:
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          FIXTURE_REQUIRE_BISON: >-
            ${{ needs.plan.outputs.missing_dependency_probe == 'bison' &&
                'true' || '' }}
          VCPKG_GITHUB_CACHE_TOKEN: ${{ github.token }}
          VCPKG_ROOT: vcpkg
        with:
          release: "7.9"
          usesh: true
          sync: rsync
          copyback: true
          envs: >-
            CACHE_MODE FIXTURE_REQUIRE_BISON VCPKG_GITHUB_CACHE_TOKEN
            VCPKG_ROOT
          prepare: |
            missing_dependency_probe=${{ needs.plan.outputs.missing_dependency_probe }}
            packages="cmake ninja git gmake bash patchelf rsync"
            if [ "${missing_dependency_probe}" != bison ]; then
              packages="${packages} bison"
            fi
            pkg_add -I ${packages}
          run: |
            export BSD_COPYBACK_DIR=.openbsd-copyback
            export BSD_TRIPLET=x64-openbsd-vcpkg-github-cache
            export VCPKG_GITHUB_CACHE_SETUP_ENV="${{ steps.vc.outputs.setup-env }}"
            export VCPKG_GITHUB_CACHE_SETUP_SCRIPT="${{ steps.vc.outputs.setup-script }}"
            sh test/fixtures/cmake-vcpkg/run-bsd-fixture.sh

      - name: Ensure fixture log exists
        if: always()
        run: |
          touch setup.log build.log build-warm.log tool-warm.log
          if [ ! -f build.status ]; then
            echo 1 > build.status
          fi
          if [ ! -f build-warm.status ]; then
            echo 1 > build-warm.status
          fi
          if [ ! -f tool-warm.status ]; then
            echo 1 > tool-warm.status
          fi

      - name: Analyze fixture cache
        id: analyze
        if: always()
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build.log
          fail-on: never

      - name: Assert fixture cache status
        if: always()
        env:
          BUILD_STATUS_FILE: build.status
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          CACHE_STATUS: ${{ steps.analyze.outputs['cache-status'] }}
          DIAGNOSIS: ${{ steps.analyze.outputs.diagnosis }}
          FAILURE_KIND: ${{ steps.analyze.outputs['failure-kind'] }}
        run: node scripts/assert-integration-result.mjs

      - name: Check OpenBSD fixture status
        if: >-
          ${{ always() &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        run: |
          exit "$(cat build.status)"

      - name: Assert OpenBSD missing dependency probe
        if: >-
          ${{ always() &&
              needs.plan.outputs.missing_dependency_probe != 'none' }}
        env:
          BUILD_LOG_FILE: build.log
          BUILD_STATUS_FILE: build.status
          EXPECTED_NEEDED_BY: project configure
          EXPECTED_TOOL: ${{ needs.plan.outputs.missing_dependency_probe }}
        run: node scripts/assert-missing-system-dependency.mjs

      - name: Assert OpenBSD vcpkg tool cache
        if: >-
          ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        env:
          BUILD_STATUS_FILE: build.status
          TARGET_OS: openbsd
          TOOL_LOG_FILE: setup.log
          TOOL_WARM_LOG_FILE: tool-warm.log
          TOOL_WARM_STATUS_FILE: tool-warm.status
        run: node scripts/assert-bsd-tool-cache.mjs

      - name: Analyze warm fixture cache
        id: analyze_warm
        if: >-
          ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build-warm.log
          fail-on: never

      - name: Assert warm fixture cache status
        if: >-
          ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        env:
          BUILD_STATUS_FILE: build-warm.status
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          CACHE_STATUS: ${{ steps.analyze_warm.outputs['cache-status'] }}
          DIAGNOSIS: ${{ steps.analyze_warm.outputs.diagnosis }}
          EXPECTED_CACHE_STATUS: warm-hit
          EXPECTED_FAILURE_KIND: ""
          FAILURE_KIND: ${{ steps.analyze_warm.outputs['failure-kind'] }}
        run: node scripts/assert-integration-result.mjs

      - name: Check OpenBSD warm fixture status
        if: >-
          ${{ always() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        run: |
          exit "$(cat build-warm.status)"

      - name: Upload fixture logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openbsd-fixture-${{ matrix.vcpkg_ref_slug }}
          path: |
            setup.log
            build.log
            build.status
            build-warm.log
            build-warm.status
            tool-warm.log
            tool-warm.status
          if-no-files-found: warn
          retention-days: ${{ needs.plan.outputs.retention }}

  netbsd:
    name: NetBSD fixture (${{ matrix.vcpkg_ref }})
    needs: plan
    if: ${{ needs.plan.outputs.netbsd == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout action
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ matrix.vcpkg_ref }}
          path: vcpkg
          persist-credentials: false

      - name: Generate vcpkg cache setup script
        id: vc
        uses: ./
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          access: ${{ needs.plan.outputs.cache_access }}
          install-nuget: ${{ needs.plan.outputs.install_nuget }}
          execution-mode: emit-script
          target-os: netbsd

      - name: Build fixture on NetBSD
        uses: vmactions/netbsd-vm@99816dccf75edf233ed6cd00a159e3a5b85ea373 # v1
        env:
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          FIXTURE_REQUIRE_BISON: >-
            ${{ needs.plan.outputs.missing_dependency_probe == 'bison' &&
                'true' || '' }}
          VCPKG_GITHUB_CACHE_TOKEN: ${{ github.token }}
          VCPKG_ROOT: vcpkg
        with:
          release: "10.1"
          usesh: true
          sync: rsync
          copyback: true
          envs: >-
            CACHE_MODE FIXTURE_REQUIRE_BISON VCPKG_GITHUB_CACHE_TOKEN
            VCPKG_ROOT
          prepare: |
            missing_dependency_probe=${{ needs.plan.outputs.missing_dependency_probe }}
            packages="cmake ninja-build git gmake bash"
            if [ "${missing_dependency_probe}" != bison ]; then
              packages="${packages} bison"
            fi
            /usr/sbin/pkg_add -u ${packages}
            /usr/sbin/pkg_add -u patchelf pkgconf rsync
          run: |
            export BSD_COPYBACK_DIR=.netbsd-copyback
            export BSD_TRIPLET=x64-netbsd-vcpkg-github-cache
            export VCPKG_GITHUB_CACHE_SETUP_ENV="${{ steps.vc.outputs.setup-env }}"
            export VCPKG_GITHUB_CACHE_SETUP_SCRIPT="${{ steps.vc.outputs.setup-script }}"
            sh test/fixtures/cmake-vcpkg/run-bsd-fixture.sh

      - name: Ensure fixture log exists
        if: always()
        run: |
          touch setup.log build.log build-warm.log tool-warm.log
          if [ ! -f build.status ]; then
            echo 1 > build.status
          fi
          if [ ! -f build-warm.status ]; then
            echo 1 > build-warm.status
          fi
          if [ ! -f tool-warm.status ]; then
            echo 1 > tool-warm.status
          fi

      - name: Analyze fixture cache
        id: analyze
        if: always()
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build.log
          fail-on: never

      - name: Assert fixture cache status
        if: always()
        env:
          BUILD_STATUS_FILE: build.status
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          CACHE_STATUS: ${{ steps.analyze.outputs['cache-status'] }}
          DIAGNOSIS: ${{ steps.analyze.outputs.diagnosis }}
          FAILURE_KIND: ${{ steps.analyze.outputs['failure-kind'] }}
        run: node scripts/assert-integration-result.mjs

      - name: Check NetBSD fixture status
        if: >-
          ${{ always() &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        run: |
          exit "$(cat build.status)"

      - name: Assert NetBSD missing dependency probe
        if: >-
          ${{ always() &&
              needs.plan.outputs.missing_dependency_probe != 'none' }}
        env:
          BUILD_LOG_FILE: build.log
          BUILD_STATUS_FILE: build.status
          EXPECTED_NEEDED_BY: project configure
          EXPECTED_TOOL: ${{ needs.plan.outputs.missing_dependency_probe }}
        run: node scripts/assert-missing-system-dependency.mjs

      - name: Assert NetBSD vcpkg tool cache
        if: >-
          ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        env:
          BUILD_STATUS_FILE: build.status
          TARGET_OS: netbsd
          TOOL_LOG_FILE: setup.log
          TOOL_WARM_LOG_FILE: tool-warm.log
          TOOL_WARM_STATUS_FILE: tool-warm.status
        run: node scripts/assert-bsd-tool-cache.mjs

      - name: Analyze warm fixture cache
        id: analyze_warm
        if: >-
          ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build-warm.log
          fail-on: never

      - name: Assert warm fixture cache status
        if: >-
          ${{ success() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        env:
          BUILD_STATUS_FILE: build-warm.status
          CACHE_MODE: ${{ needs.plan.outputs.cache_mode }}
          CACHE_STATUS: ${{ steps.analyze_warm.outputs['cache-status'] }}
          DIAGNOSIS: ${{ steps.analyze_warm.outputs.diagnosis }}
          EXPECTED_CACHE_STATUS: warm-hit
          EXPECTED_FAILURE_KIND: ""
          FAILURE_KIND: ${{ steps.analyze_warm.outputs['failure-kind'] }}
        run: node scripts/assert-integration-result.mjs

      - name: Check NetBSD warm fixture status
        if: >-
          ${{ always() && needs.plan.outputs.cache_mode == 'readwrite' &&
              needs.plan.outputs.missing_dependency_probe == 'none' }}
        run: |
          exit "$(cat build-warm.status)"

      - name: Upload fixture logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netbsd-fixture-${{ matrix.vcpkg_ref_slug }}
          path: |
            setup.log
            build.log
            build.status
            build-warm.log
            build-warm.status
            tool-warm.log
            tool-warm.status
          if-no-files-found: warn
          retention-days: ${{ needs.plan.outputs.retention }}
