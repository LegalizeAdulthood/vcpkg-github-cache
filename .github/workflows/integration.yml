name: Integration

on:
  workflow_dispatch:
    inputs:
      explicit-refs:
        description: Comma-separated vcpkg refs. Empty uses latest-tags.
        required: false
        default: ""
        type: string
      latest-tags:
        description: Number of latest vcpkg release tags to test.
        required: false
        default: "1"
        type: string
      platforms:
        description: Comma-separated platforms to test.
        required: false
        default: ubuntu
        type: string
      cache-mode:
        description: Cache scenario to run.
        required: false
        default: readwrite
        type: choice
        options:
          - readwrite
          - readonly
          - disabled
      artifact-retention-days:
        description: Retention days for integration logs and artifacts.
        required: false
        default: "7"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: Plan integration matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.refs.outputs.matrix }}
      refs: ${{ steps.refs.outputs.refs }}
      platforms: ${{ steps.inputs.outputs.platforms }}
      cache_mode: ${{ steps.inputs.outputs.cache_mode }}
      cache_access: ${{ steps.inputs.outputs.cache_access }}
      install_nuget: ${{ steps.inputs.outputs.install_nuget }}
      retention: ${{ steps.inputs.outputs.retention }}
      ubuntu: ${{ steps.inputs.outputs.ubuntu }}
      windows: ${{ steps.inputs.outputs.windows }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Record integration inputs
        id: inputs
        env:
          ARTIFACT_RETENTION_DAYS: ${{ inputs['artifact-retention-days'] }}
          CACHE_MODE: ${{ inputs['cache-mode'] }}
          PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: |
          ubuntu=false
          windows=false
          platforms=""

          IFS=',' read -ra selected_platforms <<< "$PLATFORMS"
          for platform in "${selected_platforms[@]}"; do
            platform=$(printf '%s' "$platform" |
              tr '[:upper:]' '[:lower:]' |
              tr -d '[:space:]')

            if [ -z "$platform" ]; then
              continue
            fi

            if [ -n "$platforms" ]; then
              platforms="${platforms},${platform}"
            else
              platforms="$platform"
            fi

            case "$platform" in
              all)
                ubuntu=true
                windows=true
                ;;
              linux|ubuntu|ubuntu-latest)
                ubuntu=true
                ;;
              win32|windows|windows-2022|windows-latest)
                windows=true
                ;;
            esac
          done

          if [ -z "$platforms" ]; then
            platforms=ubuntu
            ubuntu=true
          fi

          cache_access=readwrite
          install_nuget=true
          case "$CACHE_MODE" in
            readonly)
              cache_access=readonly
              ;;
            disabled)
              install_nuget=false
              ;;
          esac

          {
            echo "platforms=${platforms}"
            echo "cache_mode=${CACHE_MODE}"
            echo "cache_access=${cache_access}"
            echo "install_nuget=${install_nuget}"
            echo "retention=${ARTIFACT_RETENTION_DAYS}"
            echo "ubuntu=${ubuntu}"
            echo "windows=${windows}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve vcpkg refs
        id: refs
        env:
          EXPLICIT_REFS: ${{ inputs['explicit-refs'] }}
          LATEST_TAGS: ${{ inputs['latest-tags'] }}
        shell: bash
        run: |
          args=(--github-output "$GITHUB_OUTPUT")

          if [ -n "$EXPLICIT_REFS" ]; then
            args+=(--refs "$EXPLICIT_REFS")
          else
            args+=(--latest "$LATEST_TAGS")
          fi

          node scripts/resolve-vcpkg-refs.mjs "${args[@]}"

      - name: Write integration plan summary
        env:
          ARTIFACT_RETENTION_DAYS: ${{ steps.inputs.outputs.retention }}
          CACHE_MODE: ${{ steps.inputs.outputs.cache_mode }}
          MATRIX: ${{ steps.refs.outputs.matrix }}
          PLATFORMS: ${{ steps.inputs.outputs.platforms }}
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          {
            echo "## Integration plan"
            echo
            echo "- Platforms: \`${PLATFORMS}\`"
            echo "- Cache mode: \`${CACHE_MODE}\`"
            echo "- Artifact retention: \`${ARTIFACT_RETENTION_DAYS}\` days"
            echo "- vcpkg refs: \`${REFS}\`"
            echo
            echo '```json'
            echo "$MATRIX"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ubuntu:
    name: Ubuntu fixture (${{ matrix.vcpkg_ref }})
    needs: plan
    if: ${{ needs.plan.outputs.ubuntu == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout action
        uses: actions/checkout@v6

      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ matrix.vcpkg_ref }}
          path: vcpkg
          persist-credentials: false

      - name: Setup vcpkg cache
        uses: ./
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          access: ${{ needs.plan.outputs.cache_access }}
          install-nuget: ${{ needs.plan.outputs.install_nuget }}

      - name: Build fixture
        env:
          BUILD_DIR: ${{ runner.temp }}/vcpkg-github-cache-fixture
          BUILD_LOG: build.log
          BUILD_STATUS: build.status
          VCPKG_ROOT: vcpkg
        run: sh test/fixtures/cmake-vcpkg/build-fixture.sh

      - name: Ensure fixture log exists
        if: always()
        run: |
          touch build.log
          if [ ! -f build.status ]; then
            echo 1 > build.status
          fi

      - name: Analyze fixture cache
        if: always()
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build.log
          fail-on: never

      - name: Upload fixture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-fixture-${{ matrix.vcpkg_ref_slug }}
          path: |
            build.log
            build.status
          if-no-files-found: warn
          retention-days: ${{ needs.plan.outputs.retention }}

  windows:
    name: Windows fixture (${{ matrix.vcpkg_ref }})
    needs: plan
    if: ${{ needs.plan.outputs.windows == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout action
        uses: actions/checkout@v6

      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ matrix.vcpkg_ref }}
          path: vcpkg
          persist-credentials: false

      - name: Setup vcpkg cache
        uses: ./
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          access: ${{ needs.plan.outputs.cache_access }}
          install-nuget: ${{ needs.plan.outputs.install_nuget }}

      - name: Build fixture
        shell: cmd
        env:
          BUILD_DIR: ${{ runner.temp }}\vcpkg-github-cache-fixture
          BUILD_LOG: build.log
          BUILD_STATUS: build.status
          VCPKG_ROOT: vcpkg
        run: call test\fixtures\cmake-vcpkg\build-fixture.bat

      - name: Ensure fixture log exists
        if: always()
        shell: cmd
        run: |
          if not exist build.log type nul > build.log
          if not exist build.status > build.status echo 1

      - name: Analyze fixture cache
        if: always()
        uses: ./analyze
        with:
          token: ${{ github.token }}
          vcpkg-root: vcpkg
          build-log: build.log
          fail-on: never

      - name: Upload fixture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fixture-${{ matrix.vcpkg_ref_slug }}
          path: |
            build.log
            build.status
          if-no-files-found: warn
          retention-days: ${{ needs.plan.outputs.retention }}
